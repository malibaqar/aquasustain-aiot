<!doctype html><html lang="en"><meta charset="utf-8"><title>AquaSustain demo</title>
<h1>AquaSustain</h1><p>SIMULATED telemetry — ADC counts are not calibrated NTU.</p><pre id="output">Connecting…</pre>
<script>const out=document.getElementById('output');const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws.onmessage=e=>{out.textContent=JSON.stringify(JSON.parse(e.data),null,2)};ws.onclose=()=>out.textContent='Disconnected';</script></html>
